[project]
name = "jev-agent-eval"
version = "1.0.0"
description = "Production-grade evaluation framework for JEV as a coding-agent inference / control model"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "JEV Eval Team" }]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "jinja2>=3.1",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
]

[project.scripts]
jev-eval = "jev_agent_eval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_agent_eval"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Third-party sources fetched verbatim by dataset pinning (§10) are data,
# not code we own — never lint them.
extend-exclude = ["datasets", "scripts/vendor", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's DSL requires function calls (typer.Option/Argument) in defaults.
"src/jev_agent_eval/cli.py" = ["B008"]
# Typer testing patterns raise broad exceptions intentionally.
"tests/**" = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that contact the real JEV provider (disabled by default)",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
