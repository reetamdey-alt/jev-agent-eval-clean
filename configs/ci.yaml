# CI profile: smoke suite (~100 cases), strict gates on transport reliability.
provider:
  concurrency: 4
  requests_per_second: 2

run:
  seed: 20260920
  repeats: 1
  fail_fast: true

scoring:
  bootstrap_samples: 1000

reports:
  output_dir: "reports"
  formats:
    - json
    - markdown

thresholds:
  transport_error_rate_max: 0.01
  schema_error_rate_max: 0.01
  p95_latency_ms_max: 2000
